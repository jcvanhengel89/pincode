<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14284a">
  <title>Pincode</title>
  <style>html,body{margin:0;min-height:100%;background:#0f1f3a;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading strong{font-size:22px}.loading span{display:block;margin-top:8px;color:#b9c8dd}</style>
</head>
<body>
  <div class="loading"><div><strong>Pincode laden…</strong><span>De nieuwste versie wordt opgehaald.</span></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./app.html?v=4',{cache:'no-store'});
      if(!response.ok) throw new Error('HTTP '+response.status);
      let html=await response.text();
      html=html.replace('</body>','<script src="./refresh.js?v=4"><\\/script>\n</body>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error(error);
      document.body.innerHTML='<div class="loading"><div><strong>Kon Pincode niet laden</strong><span>Controleer je internetverbinding en probeer opnieuw.</span><p><button onclick="location.reload()" style="margin-top:14px;padding:12px 16px;border:0;border-radius:12px;font-weight:700">Opnieuw proberen</button></p></div>';
    }
  })();
  </script>
</body>
</html>
